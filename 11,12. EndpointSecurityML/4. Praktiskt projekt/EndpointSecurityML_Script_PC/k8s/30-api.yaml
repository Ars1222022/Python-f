apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: endpointsecurityml
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: endpointsecurityml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: endpointsecurityml/api:latest
          # Build locally with:
          #   docker build -t endpointsecurityml/api:latest -f Dockerfile.api .
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: endpointsecurityml-config
          env:
            - name: DATABASE_URL
              value: postgresql://airflow:CHANGE-ME@postgres:5432/endpointsecurity
          volumeMounts:
            - name: models
              mountPath: /app/models
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            # Allows a slow first load of a large model
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: endpointsecurityml
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: endpointsecurityml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
