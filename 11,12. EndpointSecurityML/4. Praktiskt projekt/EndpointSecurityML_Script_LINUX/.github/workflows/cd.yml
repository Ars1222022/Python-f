name: CD - Build and push images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.DOCKER_USERNAME }}
  API_IMAGE: ${{ secrets.DOCKER_USERNAME }}/endpointsecurity-api
  MLFLOW_IMAGE: ${{ secrets.DOCKER_USERNAME }}/endpointsecurity-mlflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.API_IMAGE }}
            ${{ env.MLFLOW_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.tags }}
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push MLflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mlflow
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.MLFLOW_IMAGE }}:${{ steps.meta.outputs.tags }}
            ${{ env.MLFLOW_IMAGE }}:${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

